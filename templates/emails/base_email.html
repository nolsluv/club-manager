<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background-color: #f8fafc;
                margin: 0;
                padding: 24px;
                color: #0f172a;
            }
            .email-container {
                max-width: 560px;
                margin: 0 auto;
                background-color: #ffffff;
                padding: 32px;
                border-radius: 8px;
                box-sizing: border-box;
                border: 1px solid #e2e8f0;
            }
            h2 {
                margin-top: 0;
                margin-bottom: 12px;
                font-size: 20px;
                font-weight: 600;
                color: #0f172a;
            }
            p {
                margin-bottom: 20px;
                font-size: 15px;
                line-height: 1.6;
                color: #334155;
            }
            .badge {
                display: inline-block;
                padding: 4px 10px;
                font-size: 12px;
                font-weight: 600;
                color: #475569;
                background-color: #f1f5f9;
                border-radius: 9999px;
                margin-bottom: 16px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .btn {
                display: inline-block;
                padding: 10px 18px;
                font-size: 14px;
                font-weight: 500;
                color: #ffffff !important;
                background-color: #0f172a;
                border-radius: 6px;
                text-decoration: none;
            }
            .footer {
                margin-top: 32px;
                padding-top: 16px;
                border-top: 1px solid #f1f5f9;
                font-size: 12px;
                color: #94a3b8;
            }
        </style>
    </head>
    <body>
        <div class="email-container">
            {% block content %}
            {% endblock %}
            <div class="footer">
                {% block footer %}
                <a href="https://clawconnectuwm.me" style="color: #64748b; text-decoration: underline;">ClawConnect</a> &bull; Club Management Notification System &bull; <a href="https://clawconnectuwm.me" style="color: #64748b; text-decoration: underline;">clawconnectuwm.me</a>
                {% endblock %}
            </div>
        </div>
    </body>
</html>
