{% extends "base.html" %}

{% block title %}
Check Your Email
{% endblock %}

{% block content %}
<div class="login-page auth-background">
  <div class="login-container">
    <h1>Check Your Email</h1>
    <p class="login-description">
      If an account exists with that email address, we've sent a password reset link to your inbox.
      The link will expire in <strong>15 minutes</strong>.
    </p>
    <p class="login-footer">
      <a href="{% url 'login' %}">Return to Login</a>
    </p>
  </div>
</div>
{% endblock %}
