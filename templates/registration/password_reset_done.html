{% extends "base.html" %}
{% load static %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}
<div class="login-container">
  <h2>Check Your Email</h2>
  <p>
    If an account exists with that email address, we've sent a password reset link to your inbox.
    The link will expire in <strong>15 minutes</strong>.
  </p>
  <p class="auth-footer">
    <a href="{% url 'login' %}">Return to Login</a>
  </p>
</div>
{% endblock %}
