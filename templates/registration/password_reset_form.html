{% extends "base.html" %}
{% load static %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}
<div class="login-container">
  <h2>Forgot Password</h2>
  <p>Enter the email address associated with your Claw Connect account and we'll send you a reset link.</p>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-login">Send Reset Link</button>
  </form>

  <p class="auth-footer">
    <a href="{% url 'login' %}">Back to Login</a>
  </p>
</div>
{% endblock %}
