{% extends "base.html" %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}
<div class="login-page auth-background">
  <div class="login-container">
    <h1>Forgot Password</h1>
    <p class="login-description">
      Enter the email address associated with your Claw Connect account and we'll send you a reset link.
    </p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Send Reset Link</button>
    </form>

    <p class="login-footer">
      <a href="{% url 'login' %}">Back to Login</a>
    </p>
  </div>
</div>
{% endblock %}
